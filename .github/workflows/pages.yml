name: Deploy to GitHub Pages

on:
  push:
    # The default branch today is the POC branch; main/master are listed so a
    # later rename does not silently stop deploying.
    branches:
      - main
      - master
      - claude/svelte-recruiting-poc-3qt3jf
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `enablement` turns Pages on for the repository and points it at
      # Actions, so no manual step in repository settings is needed.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - run: npm ci

      - run: npm run build

      # Pages serves from a sub-path; the build already uses relative URLs.
      # .nojekyll keeps the static pipeline from reinterpreting the output.
      - run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
